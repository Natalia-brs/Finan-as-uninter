version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongodb_gasto_app
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_gasto_app
    restart: always
    ports:
      - "5000:5000" 
    depends_on:
      - mongo 
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      PORT: 5000
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue_gasto_app
    restart: always
    network_mode: "host"
    depends_on:
      - backend 
    environment:
      CHOKIDAR_USEPOLLING: true
      VITE_API_BASE_URL: http://localhost:5000/api 
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  mongo_data: